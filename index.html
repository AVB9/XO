<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion XO Embed</title>
    <style>
        :root {
            /* Matched to Notion's dark mode background */
            --bg-color: #191919; 
            --cell-bg: #2c2c2c;
            --cell-hover: #3d3d3d;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-x: #ff4757;
            --accent-o: #2ed573;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents iframe scrollbars */
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 260px; /* Constrained for small blocks */
        }

        .status {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            min-height: 24px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            aspect-ratio: 1; /* Keeps cells perfectly square */
            margin-bottom: 16px;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
            user-select: none;
        }

        .cell:hover {
            background-color: var(--cell-hover);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.X { color: var(--accent-x); }
        .cell.O { color: var(--accent-o); }

        button {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.15s;
            width: 100%;
        }

        button:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="status" id="status">Player X's turn</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="resetBtn">Restart Match</button>
</div>

<script>
    const boardElement = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const statusElement = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let isGameActive = true;

    const winningConditions = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    function handleCellClick(e) {
        const clickedCell = e.target;
        const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

        if (board[clickedCellIndex] !== '' || !isGameActive) return;

        updateCell(clickedCell, clickedCellIndex);
        checkResult();
    }

    function updateCell(cell, index) {
        board[index] = currentPlayer;
        cell.innerText = currentPlayer;
        cell.classList.add(currentPlayer);
    }

    function checkResult() {
        let roundWon = false;

        for (let i = 0; i < winningConditions.length; i++) {
            const [a, b, c] = winningConditions[i];
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                roundWon = true;
                break;
            }
        }

        if (roundWon) {
            statusElement.innerText = `Player ${currentPlayer} Wins!`;
            statusElement.style.color = currentPlayer === 'X' ? 'var(--accent-x)' : 'var(--accent-o)';
            isGameActive = false;
            return;
        }

        if (!board.includes('')) {
            statusElement.innerText = 'Game Tied!';
            statusElement.style.color = 'var(--text-muted)';
            isGameActive = false;
            return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusElement.innerText = `Player ${currentPlayer}'s turn`;
    }

    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        isGameActive = true;
        statusElement.innerText = `Player ${currentPlayer}'s turn`;
        statusElement.style.color = 'var(--text-color)';
        cells.forEach(cell => {
            cell.innerText = '';
            cell.classList.remove('X', 'O');
        });
    }

    boardElement.addEventListener('click', handleCellClick);
    resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
