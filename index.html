<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion XO Multiplayer (Stable UI)</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            /* Matched to Notion's dark mode background */
            --bg-color: #191919; 
            --cell-bg: #2c2c2c;
            --cell-hover: #3d3d3d;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-x: #ff4757;
            --accent-o: #2ed573;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }

        /* 1. Global Stability Fix */
        * {
            box-sizing: border-box; /* Ensures padding/borders don't shrink content area */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents iframe scrollbars */
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            width: 95%; /* Maximized for small blocks */
            max-width: 280px; /* Constrained for small blocks */
            align-items: center;
        }

        .status {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            min-height: 24px;
            width: 100%;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px; 
            width: 100%;
            margin-bottom: 16px;
        }

        /* 2. Optimized Cell Structure */
        .cell {
            background-color: var(--cell-bg);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
            user-select: none;
            
            /* 3. The Shift Fixes */
            aspect-ratio: 1; /* Forces perfectly square cells */
            overflow: hidden; /* Prevents content from pushing boundaries */
            line-height: 0;  /* Key Fix: Eliminates vertical text leading space */
            
            /* Dynamic Font Size based on wrapper width, constrained */
            font-size: min(2.5rem, 15vw);
        }

        .cell:hover {
            background-color: var(--cell-hover);
        }

        .cell:active {
            transform: scale(0.95);
        }

        /* Ensure X and O occupy identical space */
        .cell.X, .cell.O {
            display: flex; 
        }

        .cell.X { color: var(--accent-x); }
        .cell.O { color: var(--accent-o); }

        button {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.15s;
            width: 100%;
            max-width: 200px; /* Constrain button width */
        }

        button:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="status" id="status">Connecting...</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="resetBtn">Reset Game for Both</button>
</div>

<script>
    // 1. Initialize Firebase (Ensure Version 8 syntax)
    const firebaseConfig = {
        // !!! IMPORTANT !!! Locate your actual API Key in Firebase Project Settings
        apiKey: "AIzaSyAxX3iJr--KNulCnYXqpqe6eew8_0A7lEw", 
        projectId: "gos-backend",
        databaseURL: "https://gos-backend-default-rtdb.firebaseio.com/"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('notion_widgets/xo_game/state');

    // 2. DOM Elements
    const boardElement = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const statusElement = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    // 3. Local State Variables
    let localBoard = ['', '', '', '', '', '', '', '', ''];
    let localCurrentPlayer = 'X';
    let localIsGameActive = false;

    const winningConditions = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    // 4. Default State Template
    const defaultState = {
        board: ['', '', '', '', '', '', '', '', ''],
        currentPlayer: 'X',
        isGameActive: true,
        statusText: "Player X's turn",
        statusColor: "var(--text-color)"
    };

    // 5. Listen to Database Changes
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
            dbRef.set(defaultState);
            return;
        }

        // Sync local variables
        localBoard = data.board;
        localCurrentPlayer = data.currentPlayer;
        localIsGameActive = data.isGameActive;

        // Update UI
        statusElement.innerText = data.statusText;
        statusElement.style.color = data.statusColor;

        cells.forEach((cell, index) => {
            cell.innerText = localBoard[index];
            cell.className = 'cell'; // Force reset all classes
            if (localBoard[index] !== '') {
                cell.classList.add(localBoard[index]);
            }
        });
    });

    // 6. Handle Interaction
    function handleCellClick(e) {
        // Guard clause for edge of cells
        if (!e.target.classList.contains('cell')) return; 
        
        const clickedCellIndex = parseInt(e.target.getAttribute('data-index'));

        if (localBoard[clickedCellIndex] !== '' || !localIsGameActive) return;

        localBoard[clickedCellIndex] = localCurrentPlayer;
        
        let roundWon = false;
        for (let i = 0; i < winningConditions.length; i++) {
            const [a, b, c] = winningConditions[i];
            if (localBoard[a] && localBoard[a] === localBoard[b] && localBoard[a] === localBoard[c]) {
                roundWon = true;
                break;
            }
        }

        let newState = {
            board: localBoard,
            currentPlayer: localCurrentPlayer,
            isGameActive: true,
            statusText: "",
            statusColor: ""
        };

        if (roundWon) {
            newState.isGameActive = false;
            newState.statusText = `Player ${localCurrentPlayer} Wins!`;
            newState.statusColor = localCurrentPlayer === 'X' ? 'var(--accent-x)' : 'var(--accent-o)';
        } else if (!localBoard.includes('')) {
            newState.isGameActive = false;
            newState.statusText = 'Game Tied!';
            newState.statusColor = 'var(--text-muted)';
        } else {
            newState.currentPlayer = localCurrentPlayer === 'X' ? 'O' : 'X';
            newState.statusText = `Player ${newState.currentPlayer}'s turn`;
            newState.statusColor = 'var(--text-color)';
        }

        dbRef.set(newState);
    }

    function resetGame() {
        dbRef.set(defaultState);
    }

    boardElement.addEventListener('click', handleCellClick);
    resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
